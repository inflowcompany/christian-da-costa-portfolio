[build]
  command = "npm run qa"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.15.0"
  NPM_VERSION = "11.17.0"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and installs its maintained OpenNext adapter automatically.
# No site is linked and this file does not deploy anything by itself.
